# iterate/core's workspace: generated in iterate's own repo from its pnpm-workspace.yaml, for
# these packages alone, with the same settings and the catalog trimmed to what they use.
packages:
  - core/*

catalog:
  '@base-ui/react': ^1.8.0
  '@cloudflare/workers-oauth-provider': 1.0.0
  '@cloudflare/workers-types': ^5.20261001.1
  '@modelcontextprotocol/client': 2.1.0
  '@modelcontextprotocol/server': 2.1.0
  '@tailwindcss/vite': ^4.3.3
  '@tanstack/react-router': 1.170.39
  '@tanstack/react-start': 1.168.58
  '@types/node': ^24.13.6
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@types/ws': ^8.18.1
  '@vitejs/plugin-react': ^6.1.1
  alchemy: 2.0.0-beta.81
  capnweb: npm:@iterate-com/capnweb@0.12.3
  class-variance-authority: ^0.7.1
  cn: ^0.4.0
  effect: 4.0.1
  esbuild: ^0.28.2
  jose: 6.2.12
  json5: ^2.2.3
  jsqr: 1.4.0
  lucide-react: ^1.48.0
  oauth4webapi: ^3.8.8
  pako: ^3.0.2
  posthog-js: 1.434.12
  react: ^19.3.0
  react-dom: ^19.3.0
  shadcn: 4.21.0
  sqlfu: 0.1.1
  standardwebhooks: 1.1.1
  tailwindcss: ^4.3.3
  trpc-cli: 0.17.0
  tsdown: 0.23.0
  tw-animate-css: ^1.4.0
  typescript: ^7.0.2
  uqr: 0.1.3
  vite: ^8.3.0
  vitest: ^4.1.11
  ws: 8.21.3
  zod: 4.6.5

cleanupUnusedCatalogs: true

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - miniflare
  - wrangler
  - workerd
  - '@cloudflare/workerd-darwin-64'
  - '@cloudflare/workerd-darwin-arm64'
  - '@cloudflare/workerd-linux-64'
  - '@cloudflare/workerd-linux-arm64'
  - '@cloudflare/workerd-windows-64'
  - '@cloudflare/unenv-preset'
  - '@cloudflare/vite-plugin'
  - '@cloudflare/vitest-plugin'
  - '@cloudflare/workers-types'
  - middlewright
  - trpc-cli
  - '@iterate-com/capnweb'

onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - esbuild
  - lightningcss
  - sharp
  - workerd

overrides:
  workerd: 1.20261001.1
  ws: 'catalog:'

patchedDependencies:
  '@iterate-com/capnweb@0.12.3': patches/@iterate-com__capnweb@0.12.3.patch
  alchemy@2.0.0-beta.81: patches/alchemy@2.0.0-beta.81.patch
  zod@4.6.5: patches/zod@4.6.5.patch
