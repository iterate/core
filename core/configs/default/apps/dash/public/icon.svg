<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The Dash app's mark: Lucide's "layout-dashboard" (https://lucide.dev, ISC license), white on a
       square. manifest.webmanifest names it, and the mind's sign-in pages show it. -->
  <rect width="64" height="64" fill="#18181b" />
  <g
    transform="translate(14 14) scale(1.5)"
    fill="none"
    stroke="#fff"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <rect width="7" height="9" x="3" y="3" rx="1" />
    <rect width="7" height="5" x="14" y="3" rx="1" />
    <rect width="7" height="9" x="14" y="12" rx="1" />
    <rect width="7" height="5" x="3" y="16" rx="1" />
  </g>
</svg>
