<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Guestbook</title>
    <!-- What the app is called and its icon. The mind's sign-in pages read the manifest and show
         both to a person who signs in from here (AGENTS.md, "People who are not members"). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <!-- iterate's components, pinned to one build. To upgrade, change the version here. -->
    <script type="importmap">
      {
        "imports": {
          "@iterate-com/ui/": "https://esm.iterate.com/@iterate-com/ui@0.1.0-main.20261113T210756Z-a0b13bb/",
          "react": "https://esm.iterate.com/@iterate-com/ui@0.1.0-main.20261113T210756Z-a0b13bb/react",
          "react/": "https://esm.iterate.com/@iterate-com/ui@0.1.0-main.20261113T210756Z-a0b13bb/react/",
          "react-dom": "https://esm.iterate.com/@iterate-com/ui@0.1.0-main.20261113T210756Z-a0b13bb/react-dom",
          "react-dom/": "https://esm.iterate.com/@iterate-com/ui@0.1.0-main.20261113T210756Z-a0b13bb/react-dom/",
          "lucide-react": "https://esm.iterate.com/lucide-react@1.48.0?external=react,react-dom"
        }
      }
    </script>
    <link
      rel="stylesheet"
      href="https://esm.iterate.com/@iterate-com/ui@0.1.0-main.20261113T210756Z-a0b13bb/styles.css"
    />
    <link rel="stylesheet" href="/app.css" />
    <!-- The page takes a new commit by itself: apps/live-reload/live-reload.js says how. Take
         this line out, and the page changes at its next load only. It is in the head, where the
         browser can wait for it before it draws: after a reload that the script asked for,
         nothing is drawn before the script has put what the person saw back over the app. -->
    <script type="module" src="/live-reload.js" blocking="render"></script>
  </head>
  <body>
    <div id="root"><p class="guestbook-note">Loading…</p></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
