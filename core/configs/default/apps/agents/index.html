<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agents</title>
    <!-- iterate's components, pinned to one build. To upgrade, change the version here. -->
    <script type="importmap">
      {
        "imports": {
          "@iterate-com/ui/": "https://esm.iterate.com/@iterate-com/ui@0.1.0-main.20261112T011732Z-53229f9/",
          "react": "https://esm.iterate.com/@iterate-com/ui@0.1.0-main.20261112T011732Z-53229f9/react",
          "react/": "https://esm.iterate.com/@iterate-com/ui@0.1.0-main.20261112T011732Z-53229f9/react/",
          "react-dom": "https://esm.iterate.com/@iterate-com/ui@0.1.0-main.20261112T011732Z-53229f9/react-dom",
          "react-dom/": "https://esm.iterate.com/@iterate-com/ui@0.1.0-main.20261112T011732Z-53229f9/react-dom/",
          "lucide-react": "https://esm.iterate.com/lucide-react@1.48.0?external=react,react-dom"
        }
      }
    </script>
    <link
      rel="stylesheet"
      href="https://esm.iterate.com/@iterate-com/ui@0.1.0-main.20261112T011732Z-53229f9/styles.css"
    />
    <!-- The look of this mind's apps: apps/theme.css, one file for every app. One line there
         makes them all dark. shadcn's components also ask for the class `dark`, so the script
         puts it on <html> when the file says dark. -->
    <link rel="stylesheet" href="/theme.css" />
    <script>
      if (getComputedStyle(document.documentElement).colorScheme === "dark")
        document.documentElement.classList.add("dark");
    </script>
    <link rel="stylesheet" href="/app.css" />
    <!-- The page takes a new commit by itself: apps/live-reload/live-reload.js says how. Take
         this line out, and the page changes at its next load only. It is in the head, where the
         browser can wait for it before it draws: after a reload that the script asked for,
         nothing is drawn before the script has put what the person saw back over the app. -->
    <script type="module" src="/live-reload.js" blocking="render"></script>
  </head>
  <body>
    <div id="root"><p class="p-4 text-sm text-muted-foreground">Connecting…</p></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
