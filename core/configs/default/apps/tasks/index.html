<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tasks</title>
    <!-- The components' modules and stylesheet come from one other host: the connection to it
         starts now, while the rest of this head is read. -->
    <link rel="preconnect" href="https://esm.iterate.com" crossorigin />
    <!-- What the app is called and its icon: the mind's sign-in pages show both. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <!-- iterate's components, pinned to one build: the one the Dash and Docs pin. To upgrade,
         change the version here. -->
    <script type="importmap">
      {
        "imports": {
          "@iterate-com/ui/": "https://esm.iterate.com/@iterate-com/ui@0.1.0-main.20261124T154040Z-83b4390/",
          "react": "https://esm.iterate.com/@iterate-com/ui@0.1.0-main.20261124T154040Z-83b4390/react",
          "react/": "https://esm.iterate.com/@iterate-com/ui@0.1.0-main.20261124T154040Z-83b4390/react/",
          "react-dom": "https://esm.iterate.com/@iterate-com/ui@0.1.0-main.20261124T154040Z-83b4390/react-dom",
          "react-dom/": "https://esm.iterate.com/@iterate-com/ui@0.1.0-main.20261124T154040Z-83b4390/react-dom/",
          "lucide-react": "https://esm.iterate.com/lucide-react@1.48.0?external=react,react-dom"
        }
      }
    </script>
    <!-- The page's socket, asked for here and not when the app's modules have loaded: `memberItx`
         (@iterate-com/ui/live, in app.js) takes it for its first session. It stands before the
         stylesheets, because a script after a stylesheet waits for it. -->
    <script>
      try {
        window.__itxSocket = new WebSocket(new URL("/itx", location.href.replace(/^http/, "ws")));
        // time to itx: when the socket opens (page-events.md, "Speed")
        window.__itxSocket.addEventListener("open", () => performance.mark("iterate:itx-open"), {
          once: true,
        });
      } catch {}
    </script>
    <!-- The kit's stylesheet for a page with the docs editor (the task sheet has one): everything
         styles.css holds, and the editor's own classes and its live preview's look. It takes the
         place of styles.css: a page links one of the two, never both. -->
    <link
      rel="stylesheet"
      href="https://esm.iterate.com/@iterate-com/ui@0.1.0-main.20261124T154040Z-83b4390/docs-editor.css"
    />
    <!-- The look of this mind's apps: apps/theme.css, one file for every app. One line there
         makes them all dark. shadcn's components also ask for the class `dark`, so the script
         puts it on <html> when the file says dark. -->
    <link rel="stylesheet" href="/theme.css" />
    <script>
      if (getComputedStyle(document.documentElement).colorScheme === "dark")
        document.documentElement.classList.add("dark");
    </script>
    <link rel="stylesheet" href="/app.css" />
    <!-- The page takes a new commit by itself: apps/live-reload/live-reload.js says how. A commit
         that changes a task changes no file of this page, so it reloads nothing. -->
    <script type="module" src="/live-reload.js" blocking="render"></script>
  </head>
  <body>
    <div id="root"><p class="tasks-note">Connecting…</p></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
